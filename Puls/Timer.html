<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Мій супер таймер</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      color: #111;
      font-family: Arial, sans-serif;
    }

    .timers {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 32px;
      padding: 24px;
      width: 100%;
      max-width: 900px;
    }

    .timer {
      flex: 1;
      min-width: 0;
      padding: 24px 16px;
      text-align: center;
      border: 1px solid #ddd;
      border-radius: 16px;
      background: #fafafa;
    }

    .timer h2 {
      font-size: 20px;
      margin: 0 0 20px;
    }

    .timerText {
      font-size: 25px;
      font-weight: bold;
      line-height: 1.6;
      white-space: pre-line;
    }

    @media (max-width: 600px) {
      .timers {
        flex-direction: column;
        gap: 16px;
        max-width: 420px;
      }

      .timer {
        padding: 20px 12px;
      }

      .timerText {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>
  <main class="timers">
    <section class="timer">
      <h2>Звичайний відлік</h2>
      <div id="timerSimple" class="timerText">Завантаження...</div>
    </section>

    <section class="timer">
      <h2>Календарний відлік</h2>
      <div id="timerCalendar" class="timerText">Завантаження...</div>
    </section>
  </main>

  <script>
    // Кінцева дата за місцевим часом пристрою.
    const targetTime = new Date(2028, 9, 24, 0, 0, 0);

    const simple = document.getElementById("timerSimple");
    const calendar = document.getElementById("timerCalendar");

    // Створює дату зі збереженням часу доби.
    // День обмежується останнім днем цільового місяця.
    function makeClampedDate(source, year, month, day) {
      const result = new Date(source);
      result.setDate(1);
      result.setFullYear(year, month, 1);

      const lastDay = new Date(
        result.getFullYear(),
        result.getMonth() + 1,
        0
      ).getDate();

      result.setDate(Math.min(day, lastDay));
      return result;
    }

    function addYears(date, count) {
      return makeClampedDate(
        date,
        date.getFullYear() + count,
        date.getMonth(),
        date.getDate()
      );
    }

    function addMonths(date, count) {
      const totalMonths =
        date.getFullYear() * 12 + date.getMonth() + count;

      const year = Math.floor(totalMonths / 12);
      const month = totalMonths % 12;

      return makeClampedDate(
        date,
        year,
        month,
        date.getDate()
      );
    }

    function updateTimer() {
      const now = new Date();
      const diff = targetTime.getTime() - now.getTime();

      if (diff <= 0) {
        simple.textContent = "Час вийшов!";
        calendar.textContent = "Час вийшов!";
        return;
      }

      // Блок 1: загальна кількість днів, годин і хвилин.
      const totalMinutes = Math.floor(diff / 60000);
      const days = Math.floor(totalMinutes / 1440);
      const hours = Math.floor((totalMinutes % 1440) / 60);
      const minutes = totalMinutes % 60;

      simple.textContent =
        `Залишилося:\n${days} днів\n${hours} годин\n${minutes} хвилин`;

      // Блок 2: послідовний календарний розрахунок.
      let cursor = new Date(now);

      let years = targetTime.getFullYear() - cursor.getFullYear();

      while (years > 0 && addYears(cursor, years) > targetTime) {
        years--;
      }

      cursor = addYears(cursor, years);

      let months =
        (targetTime.getFullYear() - cursor.getFullYear()) * 12 +
        targetTime.getMonth() - cursor.getMonth();

      while (months > 0 && addMonths(cursor, months) > targetTime) {
        months--;
      }

      cursor = addMonths(cursor, months);

      let calendarDays = 0;
      let nextDay = new Date(cursor);

      while (true) {
        nextDay = new Date(cursor);
        nextDay.setDate(nextDay.getDate() + 1);

        if (nextDay > targetTime) break;

        cursor = nextDay;
        calendarDays++;
      }

      // Залишок завжди невід'ємний.
      const remainingMs = Math.max(
        0,
        targetTime.getTime() - cursor.getTime()
      );

      const calendarHours = Math.floor(remainingMs / 3600000);
      const calendarMinutes =
        Math.floor((remainingMs % 3600000) / 60000);

      calendar.textContent =
        `Залишилося:\n${years} років\n${months} місяців\n` +
        `${calendarDays} днів\n${calendarHours} годин\n` +
        `${calendarMinutes} хвилин`;
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
